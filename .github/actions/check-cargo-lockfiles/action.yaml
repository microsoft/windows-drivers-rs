name: Check Cargo Lockfiles
description: Validate tracked Cargo.lock files without changing them, honoring each project's Cargo configuration.

inputs:
  lockfile:
    description: Repository-relative tracked Cargo.lock path. Checks all tracked lockfiles when omitted.
    required: false
    default: ""
  toolchain:
    description: Already-installed Rust channel to use (stable, beta, or nightly).
    required: false
    default: stable

runs:
  using: composite
  steps:
    - name: Check Cargo lockfiles
      shell: pwsh
      env:
        LOCKFILE_ACTION_PATH: ${{ github.action_path }}
        LOCKFILE_PATH: ${{ inputs.lockfile }}
        LOCKFILE_TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        & (Join-Path $env:LOCKFILE_ACTION_PATH 'check-lockfiles.ps1') -Lockfile $env:LOCKFILE_PATH -Toolchain $env:LOCKFILE_TOOLCHAIN
