name: Windows Runner Debug

on:
  push:
    branches: ['fix/winget-rpc-readiness']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    if: github.ref == 'refs/heads/fix/winget-rpc-readiness'
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Interactive runner debugging
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3
        timeout-minutes: 45
        with:
          limit-access-to-actor: true