name: Windows Runner Debug

on:
  push:
    branches: ['fix/winget-rpc-readiness']
  workflow_dispatch:

permissions: {}

jobs:
  debug:
    if: github.ref == 'refs/heads/fix/winget-rpc-readiness'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Interactive runner debugging
        uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
        with:
          limit-access-to-actor: true