name: Lockfile Consistency Checks

on:
  push:
    branches-ignore:
      - "gh-readonly-queue/**"
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.compare || github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check-lockfiles:
    name: Summarize Lockfile Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check Cargo lockfiles
        uses: ./.github/actions/check-cargo-lockfiles

      - name: Test lockfile checker
        shell: pwsh
        run: ./.github/actions/check-cargo-lockfiles/check-lockfiles.Tests.ps1
