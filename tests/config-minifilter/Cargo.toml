[package]
description = "An empty package that sets the `package.metadata` required for wdk-build to generate File System Minifilter bindings for Rust"
edition = "2024"
license = "MIT OR Apache-2.0"
name = "config-minifilter"
publish = false
version = "0.1.0"

[package.metadata.wdk.driver-model]
driver-type = "WDM"

[lib]

[dependencies]
wdk-sys = { features = ["minifilter"], path = "../../crates/wdk-sys" }

[features]
nightly = ["wdk-sys/nightly"]
