[package]
edition = "2024"
name = "driver"
publish = false
version = "0.0.0"

# This driver package uses the metadata from the workspace, but still needs this tag to signal that its a driver crate that needs packaging
[package.metadata.wdk]

[lib]
crate-type = ["cdylib"]

[build-dependencies]
wdk-build.workspace = true

[dependencies]
wdk.workspace = true
wdk-alloc.workspace = true
wdk-panic.workspace = true
wdk-sys.workspace = true

[dev-dependencies]
# The feature "test-stubs" isn't needed since gating the DriverEntry export_name keeps
# driver_entry from being codegen'd, so nothing references WDF functions. Switch to "test-stubs"
# if a test ever reaches a call_unsafe_wdf_function_binding! call site.
wdk-sys = { features = ["test-stubs"], workspace = true }
